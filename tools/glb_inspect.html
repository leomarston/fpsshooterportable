<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#222;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/addons/"}}</script>
</head><body>
<canvas id="c" width="900" height="900"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(900,900,false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x223044);
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.4));
const dl = new THREE.DirectionalLight(0xffffff,1.6); dl.position.set(1,2,1); scene.add(dl);

window.__INFO = null;
new GLTFLoader().load('../assets/maps/Metro.glb', (gltf)=>{
  const root = gltf.scene;
  scene.add(root);
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const size = new THREE.Vector3(), center = new THREE.Vector3();
  box.getSize(size); box.getCenter(center);
  // material/mesh summary
  const meshNames = []; let meshCount=0, triCount=0;
  root.traverse(o=>{ if(o.isMesh){ meshCount++; meshNames.push(o.name);
    const g=o.geometry; if(g.index) triCount+=g.index.count/3; else if(g.attributes.position) triCount+=g.attributes.position.count/3; } });
  window.__INFO = {
    min:[+box.min.x.toFixed(2),+box.min.y.toFixed(2),+box.min.z.toFixed(2)],
    max:[+box.max.x.toFixed(2),+box.max.y.toFixed(2),+box.max.z.toFixed(2)],
    size:[+size.x.toFixed(2),+size.y.toFixed(2),+size.z.toFixed(2)],
    center:[+center.x.toFixed(2),+center.y.toFixed(2),+center.z.toFixed(2)],
    meshCount, triCount, meshNames: meshNames.slice(0,90),
  };

  // top-down orthographic view
  const maxXZ = Math.max(size.x, size.z) * 0.55;
  const cam = new THREE.OrthographicCamera(-maxXZ,maxXZ,maxXZ,-maxXZ,0.1, size.y+ Math.max(size.x,size.z)+50);
  cam.position.set(center.x, box.max.y + Math.max(size.x,size.z)*0.6 + 5, center.z);
  cam.up.set(0,0,-1); cam.lookAt(center.x, center.y, center.z);
  renderer.render(scene, cam);
  window.__VIEW = 'top';
  window.__cams = { center, box, size };
  window.__renderEye = (px,py,pz,lx,ly,lz)=>{
    const pc = new THREE.PerspectiveCamera(75, 1, 0.05, 2000);
    pc.position.set(px,py,pz); pc.lookAt(lx,ly,lz);
    renderer.render(scene, pc);
  };
  window.__renderTop = ()=>{ renderer.render(scene, cam); };
  window.__DONE = true;
}, undefined, (err)=>{ window.__INFO = { error: String(err) }; window.__DONE = true; });
</script>
</body></html>
